name: ci

# 审查 60-build-test §2.4：仓库此前没有任何 CI，`tsc` / `vitest` / `cargo test` /
# `cargo fmt` / `cargo clippy` 全部只靠本机自觉。这里把已有能力串成门禁，
# 不新增任何第三方 action（除 setup-node）；Rust 用 runner 自带的 rustup。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: 前端 · 类型 / 测试 / 构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 安装依赖（校验 lockfile 与 package.json 一致）
        run: npm ci
      - name: 版本号一致性
        run: npm run check:version
      - name: 类型检查（src + 构建配置）
        run: npm run check:types
      - name: ESLint（缺陷类规则为 error，风格类为 warning）
        run: npm run lint
      - name: 格式检查（Prettier 是唯一的格式来源）
        run: npm run format:check
      - name: 单元测试
        run: npm test
      - name: 覆盖率门禁
        run: npm run test:coverage
      - name: 生产构建（含 chunk 分组）
        run: npx vite build
      - name: 生产依赖漏洞
        run: npm audit --omit=dev --audit-level=high

  rust:
    name: Rust · 格式 / Clippy / 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 clippy 与 rustfmt
        run: rustup component add clippy rustfmt
      - name: 系统依赖（Tauri 2 / GTK）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: 格式检查
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: Clippy（warnings 视为错误）
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

  upstream:
    name: 上游漂移（仅提示，不阻断）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: 对齐提交至今的 CLI / 请求体变化
        run: node scripts/upstream-diff.mjs
