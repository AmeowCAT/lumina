<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0b09" />
    <title>流光 Lumina</title>
    <script>
      // 主题引导:首帧渲染前恢复持久化主题,避免默认暗色闪切(FOUC)。
      // 与 src/lib/theme.ts 的 STORAGE_KEY / themeColor 保持一致。
      try {
        var t = localStorage.getItem("lumina:theme");
        if (t !== "lumina" && t !== "vostok") t = "lumina";
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "vostok" ? "#110e0b" : "#0d0b09");
      } catch (e) {
        /* localStorage 不可用时保持默认主题 */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
