[package]
name = "lumina"
version = "0.7.14"
edition = "2021"
description = "Lumina (流光) — desktop GUI for stable-diffusion.cpp sd-server"

[lib]
name = "lumina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
rfd = "0.15"
base64 = "0.22"
anyhow = "1"
dirs = "5"
log = "0.4"
env_logger = "0.11"

# Windows: sd-server 子进程挂进 KILL_ON_JOB_CLOSE 作业对象，GUI 崩溃/被强杀
# 时由 OS 兜底终止，避免孤儿进程占显存（对抗性审查 C）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
