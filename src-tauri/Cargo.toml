[package]
name = "lumina"
version = "0.7.8"
edition = "2021"
description = "Lumina (流光) — desktop GUI for stable-diffusion.cpp sd-server"

[lib]
name = "lumina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
rfd = "0.15"
base64 = "0.22"
anyhow = "1"
dirs = "5"
log = "0.4"
env_logger = "0.11"
